# Memory limits for a 3 GB development machine: one Gradle daemon, two workers,
# a separate Kotlin daemon. The daemon idle timeout lives in ~/.gradle/gradle.properties.
org.gradle.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8
org.gradle.workers.max=2
org.gradle.parallel=false
org.gradle.caching=true
kotlin.daemon.jvmargs=-Xmx512m

kotlin.code.style=official
