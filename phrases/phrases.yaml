# Системные фразы приложения (MOB-11, PROTO-11): id: текст.
# id - имя ресурса Android [a-z][a-z0-9_]*: WAV лежит в app/src/main/res/raw/phrase_<id>.wav,
# тот же текст - строка phrase_<id> в app/src/main/res/values/strings.xml.
# WAV готовит tts-service (TTS-8):
#   cd tts-service && uv run scripts/render_phrases.py \
#     --phrases ../assistant-low-vision-mobile/phrases/phrases.yaml \
#     --out ../assistant-low-vision-mobile/app/src/main/res/raw --backend <бэкенд>

